    <link rel="stylesheet" href="css/styles.css">
    <script src="js/scripts.js" defer></script>

    <!-- Navegación y Toggle de Idioma / Tema -->
    <header class="main-header">
        <nav class="main-nav">
            <ul>
                <li><a href="#resumen" data-i18n="nav_resumen"></a></li>
                <li><a href="#about" data-i18n="nav_aboutme"></a></li>

                <li><a href="#personal" data-i18n="nav_personal"></a></li>

            <button id="lang-toggle" aria-label="Cambiar idioma">

            <button id="theme-toggle" aria-label="Cambiar tema">
